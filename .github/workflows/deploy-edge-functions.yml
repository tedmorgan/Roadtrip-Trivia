name: Deploy Supabase Edge Functions

on:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-edge-functions.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # Deploy one-by-one with --use-api so a transient esm.sh/Docker
      # failure on one function cannot block the others (e.g. grok-token).
      - name: Deploy all Edge Functions
        run: |
          set -euo pipefail
          failed=0
          for fn in generate-questions grade-answer challenge-answer realtime-token grok-token gemini-live-token gemini-question-batch; do
            echo "==== Deploying ${fn} ===="
            if ! supabase functions deploy "${fn}" \
              --project-ref "$SUPABASE_PROJECT_ID" \
              --use-api; then
              echo "::error::Failed to deploy ${fn}"
              failed=1
            fi
          done
          exit "${failed}"
