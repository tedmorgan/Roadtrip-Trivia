name: Deploy Edge Functions

on:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-edge-functions.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy edge functions
        env:
          # Prefer the standard CLI env var; fall back to alternate secret names.
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN || secrets.SUPABASE_TOKEN || secrets.SUPABASE_ACCESS_TOKEN_GITHUB }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_ID || 'kakhzbcuudkrrktkobjs' }}
        run: |
          set -euo pipefail

          echo "supabase CLI: $(supabase --version)"
          echo "project_ref: ${PROJECT_REF}"
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::No Supabase access token found in GitHub Actions secrets."
            echo "Expected one of: SUPABASE_ACCESS_TOKEN, SUPABASE_TOKEN"
            echo "Add it under Repo Settings → Secrets and variables → Actions"
            exit 1
          fi
          echo "access_token: present (${#SUPABASE_ACCESS_TOKEN} chars)"

          for fn in generate-questions grade-answer challenge-answer realtime-token gemini-token grok-token; do
            echo "==== Deploying ${fn} ===="
            supabase functions deploy "${fn}" \
              --project-ref "${PROJECT_REF}" \
              --no-verify-jwt
          done

          echo "All edge functions deployed."
